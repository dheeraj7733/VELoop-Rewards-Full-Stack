name: Authentication branch checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/authentication]

jobs:
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Check JavaScript syntax
        run: |
          for file in $(find . -path './node_modules' -prune -o -name '*.js' -print); do
            node --check "$file"
          done

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
